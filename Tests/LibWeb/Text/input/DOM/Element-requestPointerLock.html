<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const iframe = document.createElement("iframe");
        document.body.append(iframe);

        const other = iframe.contentWindow;
        const element = other.document.createElement("div");
        const lockError = new Promise(resolve => other.document.onpointerlockerror = resolve);
        const promise = element.requestPointerLock({ unadjustedMovement: true });

        println(`requestPointerLock promise is iframe realm: ${promise instanceof other.Promise}`);
        println(`requestPointerLock promise is parent realm: ${promise instanceof Promise}`);

        try {
            await promise;
        } catch (e) {
            println(`requestPointerLock rejection name: ${e.name}`);
        }
        const event = await lockError;
        println(`error dispatched to requesting document: ${event.target === other.document}`);
        println(`pointer lock element after rejection: ${other.document.pointerLockElement}`);
    });
</script>
